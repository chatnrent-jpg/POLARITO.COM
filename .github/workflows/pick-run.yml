name: Pick run

# Drives the LIVE one-stock-a-day runner (/api/cron/pick-run) every ~10s during the US
# session. It does nothing at all unless Vercel has POLARITO_PAPER_INSTRUMENT=pick AND
# POLARITO_LIVE_ACCOUNT=1: with either missing the endpoint answers {"action":"none"} and this
# job exits at once, so this workflow is safe to leave in the repository while live is off.
# Real orders additionally need POLARITO_LIVE_TRADING_ENABLED=1 and an off kill switch; until
# then every tick only observes and logs what it would do.
#
# Same loop as mirror-run.yml: GitHub's schedule trigger only STARTS a job, the job loops by
# itself on the New York clock (two cron entries cover EDT and EST), stops after 5.5h and
# starts the next run itself; the concurrency group stops two loops from overlapping.
#
# Needs (Settings -> Secrets and variables -> Actions):
#   secret    POLARITO_CRON_SECRET  same value as CRON_SECRET in Vercel
#   variable  POLARITO_BASE_URL     e.g. https://www.polarito.com  (optional; that is the default)
#
# Cost: same as mirror-run.yml (free on a public repo; about 400 minutes per trading day on a
# private one, only while live is switched on, because the job exits at once otherwise).

on:
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run: one check right now (any time of day), prints what the pick would do, sends NO order"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: pick-run
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Call the live pick every 10 seconds while the market is open
        env:
          POLARITO_CRON_SECRET: ${{ secrets.POLARITO_CRON_SECRET }}
          POLARITO_BASE_URL: ${{ vars.POLARITO_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
        shell: bash
        run: |
          set -u
          BASE="${POLARITO_BASE_URL:-https://www.polarito.com}"
          BASE="${BASE%/}"
          case "$BASE" in
            https://*) ;;
            *) echo "POLARITO_BASE_URL must start with https://" >&2; exit 1 ;;
          esac
          if [ -z "${POLARITO_CRON_SECRET:-}" ]; then
            echo "POLARITO_CRON_SECRET is not set in this repository's secrets." >&2
            exit 1
          fi

          INTERVAL=10            # seconds between calls
          MAX_SECONDS=19800      # 5h30m per job, under the 6h job limit
          OPEN_MIN=$((9 * 60 + 20))    # start 10 minutes before the 09:30 open
          CLOSE_MIN=$((16 * 60 + 2))   # stop just after the 16:00 close
          HOLIDAY_AFTER=$((10 * 60))   # after 10:00 ET, repeated "bar is not today" means a holiday
          HOLIDAY_STREAK=30
          OUT="${RUNNER_TEMP:-/tmp}/pick-out.json"

          et_now() { TZ=America/New_York date '+%u %H:%M:%S'; }
          in_window() {
            local dow hms h m mins
            read -r dow hms < <(et_now)
            h="${hms:0:2}"; m="${hms:3:2}"
            mins=$((10#$h * 60 + 10#$m))
            [ "$dow" -le 5 ] && [ "$mins" -ge "$OPEN_MIN" ] && [ "$mins" -lt "$CLOSE_MIN" ]
          }
          et_minutes() {
            local dow hms
            read -r dow hms < <(et_now)
            echo $((10#${hms:0:2} * 60 + 10#${hms:3:2}))
          }

          # Dry run (manual "Run workflow" with the dry box ticked): one call with dry=1, which never sends an
          # order, whatever the switches are. It skips the window check; outside 09:30-16:00 New York the route
          # itself answers "US market is closed". The secret is only sent as a header and is never printed.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            code=$(curl --silent --show-error --max-time 55 --output "$OUT" --write-out '%{http_code}' \
              -H "Authorization: Bearer $POLARITO_CRON_SECRET" \
              "$BASE/api/cron/pick-run?ticks=1&dry=1" 2>/dev/null) || code=000
            echo "DRY RUN (no order is sent). HTTP $code"
            if jq -e . "$OUT" >/dev/null 2>&1; then
              jq . "$OUT"
              {
                echo "## Pick run: dry run (no order sent)"
                echo
                echo "HTTP status: \`$code\`"
                echo
                jq -r 'if .action == "none" then "**Not active:** \(.reason)"
                       elif .reports then
                         (.reports[] | "**Result:** ok=\(.ok) dryRun=\(.dryRun) at \(.ranAt)" + (if .error then "  \n**Problem:** \(.error)" else "" end),
                          "",
                          (.results[] | "- **\(.outcome)** \(.ticker): \(.reason)" + ((.notes // []) | map("\n  - " + .) | join(""))))
                       else "**Error:** \(.error // "unexpected answer") (\(.code // "no code"))" end' "$OUT"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            else
              echo "The server did not answer with JSON (HTTP $code)." >&2
              head -c 500 "$OUT" >&2 || true
            fi
            if [ "$code" = "401" ]; then
              echo "Unauthorized: POLARITO_CRON_SECRET does not match CRON_SECRET in Vercel." >&2
              exit 1
            fi
            [ "$code" = "200" ] || exit 1
            exit 0
          fi

          if ! in_window; then
            echo "Outside the US session window (weekday 09:20-16:02 New York). Nothing to do."
            exit 0
          fi

          START=$SECONDS
          stale=0
          failures=0
          while in_window; do
            if [ $((SECONDS - START)) -ge "$MAX_SECONDS" ]; then
              echo "Reached the 5h30m job limit with the market still open. Starting the next run."
              gh workflow run pick-run.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-master}" \
                || { echo "Could not start the next run." >&2; exit 1; }
              exit 0
            fi
            tick=$SECONDS
            code=$(curl --silent --show-error --max-time 25 --output "$OUT" --write-out '%{http_code}' \
              -H "Authorization: Bearer $POLARITO_CRON_SECRET" \
              "$BASE/api/cron/pick-run?ticks=1" 2>/dev/null) || code=000
            summary=$(jq -r 'if .action == "none" then .reason
                             else [.reports[]?.results[]? | "\(.outcome): \(.reason[0:110])"] | join(" | ") end' "$OUT" 2>/dev/null || true)
            echo "$(TZ=America/New_York date '+%H:%M:%S') ET http=$code ${summary:-no body}"

            if [ "$code" = "401" ]; then
              echo "Unauthorized: POLARITO_CRON_SECRET does not match CRON_SECRET in Vercel." >&2
              exit 1
            fi
            if jq -e '.action == "none"' "$OUT" >/dev/null 2>&1; then
              echo "The live pick is not switched on (POLARITO_PAPER_INSTRUMENT=pick and POLARITO_LIVE_ACCOUNT=1). Stopping."
              exit 0
            fi
            if [ "$code" = "200" ]; then failures=0; else failures=$((failures + 1)); fi
            if [ "$failures" -ge 60 ]; then
              echo "60 failed calls in a row. Stopping so the failure is visible." >&2
              exit 1
            fi
            if jq -e '[.reports[]?.results[]? | select(.reason | test("is not today"))] | length > 0' "$OUT" >/dev/null 2>&1 \
               && [ "$(et_minutes)" -ge "$HOLIDAY_AFTER" ]; then
              stale=$((stale + 1))
            else
              stale=0
            fi
            if [ "$stale" -ge "$HOLIDAY_STREAK" ]; then
              echo "No bar for today after 10:00 New York: the market looks closed today. Stopping."
              exit 0
            fi

            spent=$((SECONDS - tick))
            [ "$spent" -lt "$INTERVAL" ] && sleep $((INTERVAL - spent))
          done
          echo "The session window has ended."
