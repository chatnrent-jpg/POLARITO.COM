name: Intraday study (read-only)

# Manual only: there is NO schedule. Runs the same-day check of the polarity gear on real Alpaca
# 5-minute history (scripts/polarity-intraday-alpaca.ts): gear at 10:00 / 10:30 / 11:30 / 13:00 ET from the
# partial daily candle, exit at the 15:55 flatten and the 16:00 close, Drive vs baseline, Reverse for information,
# with 0 / 4 / 10 bps costs, by year and regime.
#
# READ-ONLY. It only calls Alpaca's market-data bars endpoint (data.alpaca.markets/v2/stocks/bars). It never calls a
# broker/trading endpoint, places no orders, writes nothing back to the repository (permissions: contents: read) and
# never prints the keys. The result is printed in the job log, shown on the run's Summary page and uploaded as the
# artifact "intraday-study" (markdown + JSON).
#
# Needs the same repository secrets as signal-log.yml, in EITHER form:
#   ALPACA_API_KEY_ID + ALPACA_API_SECRET_KEY    (two secrets), or
#   ALPACAKEYS                                   (one secret holding the two NAME=value lines)
on:
  workflow_dispatch:
    inputs:
      feed:
        description: "Alpaca data feed: sip (all exchanges, needs SIP history on the plan) or iex (what the live app uses by default)"
        type: choice
        options: [sip, iex]
        default: sip
      start_year:
        description: "First year of 5-minute history (2016 is the earliest SIP data)"
        type: string
        default: "2016"
      tickers:
        description: "Optional comma-separated tickers (empty = built-in list of 38 liquid names)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: intraday-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare Alpaca keys
        env:
          COMBINED: ${{ secrets.ALPACAKEYS }}
          KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          KEY_SECRET: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          f="$RUNNER_TEMP/alpaca.env"
          : > "$f"
          if [ -n "$COMBINED" ]; then printf '%s\n' "$COMBINED" | tr -d '\r' > "$f"; fi
          if [ -n "$KEY_ID" ]; then printf 'ALPACA_API_KEY_ID=%s\n' "$KEY_ID" >> "$f"; fi
          if [ -n "$KEY_SECRET" ]; then printf 'ALPACA_API_SECRET_KEY=%s\n' "$KEY_SECRET" >> "$f"; fi
          ok=1
          for v in ALPACA_API_KEY_ID ALPACA_API_SECRET_KEY; do
            if grep -q "^${v}=." "$f"; then echo "found $v"; else echo "::error::$v not found. Put NAME=value lines in secret ALPACAKEYS, or add a secret named $v."; ok=0; fi
          done
          [ "$ok" = 1 ]

      - name: Run the intraday study
        env:
          FEED: ${{ inputs.feed }}
          START_YEAR: ${{ inputs.start_year }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          set -eu
          case "$FEED" in sip|iex) ;; *) echo "::error::feed must be sip or iex"; exit 1 ;; esac
          case "$START_YEAR" in [0-9][0-9][0-9][0-9]) ;; *) echo "::error::start_year must be a 4-digit year"; exit 1 ;; esac
          if [ -n "$TICKERS" ]; then
            case "$TICKERS" in *[!A-Za-z,\ ]*) echo "::error::tickers may only contain letters, commas and spaces"; exit 1 ;; esac
            TICKER_ARG="--tickers=${TICKERS// /}"
          else
            TICKER_ARG=""
          fi
          npx tsx --env-file="$RUNNER_TEMP/alpaca.env" scripts/polarity-intraday-alpaca.ts \
            --feed="$FEED" --start-year="$START_YEAR" --out-dir=intraday-study-out $TICKER_ARG

      - name: Show the summary on the run page
        if: always()
        run: |
          if [ -f intraday-study-out/polarity-intraday-alpaca.md ]; then
            cat intraday-study-out/polarity-intraday-alpaca.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-study
          path: intraday-study-out/
          if-no-files-found: warn
          retention-days: 90

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/alpaca.env"
